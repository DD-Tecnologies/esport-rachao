name: Validate and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read this repository. Production access is held
# exclusively in repository/environment secrets.
permissions:
  contents: read

concurrency:
  group: esporte-production
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without retaining a GitHub token
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build API
        run: npm run build --workspace=@esporte/api

      - name: Build web application
        run: npm run build --workspace=@esporte/web

  deploy:
    name: Deploy to VPS
    needs: verify
    # A repository without deployment secrets still gets a green validation
    # run. The deploy is skipped rather than failing or exposing credentials.
    if: >-
      ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_PORT != '' &&
          secrets.DEPLOY_USER != '' && secrets.DEPLOY_PATH != '' &&
          secrets.DEPLOY_SSH_KEY != '' && secrets.VPS_KNOWN_HOSTS != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure short-lived SSH client
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          unset DEPLOY_SSH_KEY VPS_KNOWN_HOSTS

      - name: Update the checked-out release and restart services
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only origin main && docker compose up -d --build && docker compose ps"

      - name: Remove deployment key material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
